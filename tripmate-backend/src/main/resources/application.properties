spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ===================== Kafka =====================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}

# ---- Producer: "safe producer" + high-throughput (course videos 64-71) ----
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.retries=2147483647
# throughput knobs: wait up to 20ms to batch, compress the batch
spring.kafka.producer.properties.linger.ms=20
spring.kafka.producer.properties.compression.type=snappy

# ---- Consumer: manual commit + at-least-once (course videos 81, 83, 84, 86) ----
spring.kafka.consumer.group-id=tripmate-activity-feed
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.tripmate.*
# we commit offsets ourselves in the listener
spring.kafka.listener.ack-mode=manual
