services:
  - type: web
    name: tripmate-backend
    runtime: java
    rootDir: tripmate-backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/tripmate-backend-0.0.1-SNAPSHOT.jar
    plan: free
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
